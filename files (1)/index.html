<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>NotAraxx Technologies</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Orbitron:wght@600;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap">
<style>
:root{--bg:#eef4f0;--ink:#10261c;--mut:#4d6358;--a:#0f5c4d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1100px 600px at 15% -10%,#d8eadf,transparent),radial-gradient(900px 500px at 100% 0,#e3edf8,transparent),var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;line-height:1.55}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 5vw;flex-wrap:wrap;gap:10px}
.brand{display:flex;gap:10px;align-items:center;font:700 22px "Playfair Display",Georgia,serif;color:#0f3b4a;text-decoration:none}
nav a{margin-left:18px;color:var(--mut);text-decoration:none;font-weight:600}nav a.on,nav a:hover{color:var(--a)}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;margin:0}
.hero{text-align:center;padding:14px 5vw 0}.hero h1{font-size:clamp(38px,8vw,92px);line-height:1;color:#0f3b4a}.hero h1 em{color:#0f7a63}
.hero p{max-width:640px;margin:12px auto;color:var(--mut)}
#cv{width:100%;height:min(60vh,540px);display:block;touch-action:none;cursor:grab}
.hint{text-align:center;font:12px monospace;letter-spacing:.15em;color:var(--mut);text-transform:uppercase}
.wrap{max-width:1150px;margin:0 auto;padding:0 5vw 50px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;perspective:900px}
.card{background:#fffffd;border:1px solid #d5e3da;border-radius:18px;padding:20px;box-shadow:0 10px 24px -14px rgba(16,38,28,.35);transition:transform .15s ease,box-shadow .2s;transform-style:preserve-3d;text-decoration:none;color:inherit;display:block}
.card:hover{box-shadow:0 24px 36px -16px rgba(16,38,28,.45)}
.card b{display:block;font:600 20px "Playfair Display",Georgia,serif;color:var(--a);margin-bottom:6px}.card small{color:var(--mut);font-size:14px}
.card i{font:normal 11px monospace;display:inline-block;background:#eef4f0;border-radius:99px;padding:2px 9px;margin:8px 4px 0 0;color:var(--a)}
h2.s{font-size:clamp(26px,4vw,40px);margin:42px 0 12px}h2.s em{color:var(--a)}
.pg{padding:26px 5vw 4px;text-align:center}.pg h1{font-size:clamp(38px,7vw,72px);color:var(--a)}.pg p{color:var(--mut);max-width:620px;margin:8px auto}.pg a{color:var(--mut);font:12px monospace;letter-spacing:.12em;text-decoration:none}
.tool{background:#fff;border:1px solid #d5e3da;border-radius:18px;padding:20px;display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.tool label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:4px}.tool input{padding:9px;border:1px solid #c5d6cb;border-radius:10px;font:inherit;width:140px}
.out{font:600 20px "Playfair Display",Georgia,serif;color:var(--a);width:100%}
.sc{overflow-x:auto;padding:10px 4px 20px}.pt{display:grid;grid-template-columns:repeat(18,1fr);gap:4px;min-width:760px;perspective:1200px}
.pt b{aspect-ratio:1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 14px "DM Sans",sans-serif;transition:transform .15s;cursor:default}
.pt b span{font:9px monospace;opacity:.6}.pt b:hover{transform:translateZ(40px) scale(1.3);z-index:2;box-shadow:0 12px 20px -8px rgba(0,0,0,.35)}
.s0{background:#d9efe1}.p0{background:#dbe7f7}.d0{background:#f6e6c8}.f0{background:#eadbf3}.n0{background:#f7d9d9}
footer{text-align:center;color:var(--mut);padding:26px;font-size:14px}
.brand{font:800 18px Orbitron,"DM Sans",sans-serif;letter-spacing:.08em}
.hero h1{font:800 clamp(28px,6vw,70px) Orbitron,"DM Sans",sans-serif;letter-spacing:.02em;line-height:1.1}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#0f7a63,#1d5fa8,#6b3fa0);-webkit-background-clip:text;background-clip:text;color:transparent}
.ob{font:800 clamp(22px,4vw,38px) Orbitron,sans-serif!important;letter-spacing:.03em}
#hub{width:100%;height:min(72vh,640px);display:block;touch-action:none;cursor:grab;background:radial-gradient(circle at 50% 50%,#fff,#e9f1ec 75%);border-radius:24px;border:1px solid #d5e3da}
.exp{background:#fff;border:1px solid #d5e3da;border-left:8px solid var(--a);border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 14px 30px -18px rgba(16,38,28,.4)}
.exp h3{font:700 24px Orbitron,sans-serif;margin-bottom:6px}.exp p{font-size:17px;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.btn,.chips button{font:600 13px "DM Sans",sans-serif;border:1.5px solid var(--a);color:var(--a);background:#fff;border-radius:99px;padding:7px 14px;cursor:pointer}
.btn:hover,.chips button:hover{background:var(--a);color:#fff}
.pt2{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:4px;min-width:900px;perspective:1200px}
.t{aspect-ratio:1/1.08;border:2px solid var(--c);border-radius:6px;background:#fff;color:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:transform .15s,opacity .2s,box-shadow .2s;line-height:1.1;overflow:hidden}
.t b{font:700 clamp(12px,1.7vw,24px) "DM Sans",sans-serif}.t small{font-size:clamp(5px,.62vw,9px);color:#4d6358}.t em{position:absolute;top:2px;left:3px;font:normal 8px monospace}
.pt2 .t:hover{transform:translateZ(30px) scale(1.18);z-index:3;box-shadow:0 0 16px var(--c)}
.pt2.f .t{opacity:.14}.pt2.f .t.on{opacity:1;box-shadow:0 0 14px var(--c)}
.lg{grid-column:3/13;grid-row:1/4;display:flex;flex-wrap:wrap;gap:6px 16px;align-content:center;justify-content:center}
.lg span{font:600 13px "DM Sans",sans-serif;cursor:pointer;color:var(--c)}
#ov{position:fixed;inset:0;background:rgba(238,244,240,.82);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}#ov.on{display:flex}
.big{background:#fff;border:4px solid var(--c);border-radius:20px;padding:24px;max-width:600px;width:100%;display:flex;gap:20px;align-items:center;flex-wrap:wrap;box-shadow:0 0 44px var(--c);color:var(--c)}
.big h3{font:800 32px Orbitron,sans-serif}.big p{color:#10261c;margin:4px 0}
.ag{background:#fff;border:1px solid #d5e3da;border-radius:24px;padding:22px;box-shadow:0 20px 40px -24px rgba(16,38,28,.45)}
#log{max-height:360px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:12px 0}
#log div{padding:10px 14px;border-radius:14px;max-width:88%;white-space:pre-wrap}
#log .u{align-self:flex-end;background:var(--a);color:#fff}#log .b{background:#eef4f0}
.row{display:flex;gap:8px}.row input{flex:1;padding:11px 14px;border:1px solid #c5d6cb;border-radius:12px;font:inherit}
.nx{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:20px 0}a.btn{text-decoration:none;display:inline-block}details{width:100%}summary{cursor:pointer;font:600 13px "DM Sans",sans-serif;color:var(--a)}
#app{transition:opacity .22s ease,transform .22s ease,filter .22s ease}#app.lv{opacity:0;transform:translateY(10px);filter:blur(4px)}#app.en{animation:pin .48s cubic-bezier(.2,.8,.2,1)}
#intro{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(900px 520px at 50% 40%,#fff,#dfece4 72%);transition:opacity .8s ease,visibility .8s,transform .8s cubic-bezier(.4,0,.2,1);cursor:pointer}
#intro.out{opacity:0;visibility:hidden;transform:scale(1.05)}
#intro svg{width:104px;height:104px;animation:pop .9s cubic-bezier(.2,.8,.2,1) both}#intro svg path{stroke-dasharray:200;stroke-dashoffset:200;animation:dr 1.2s .15s ease forwards}
#intro .t{font:800 clamp(26px,6vw,54px) Orbitron,"DM Sans",sans-serif;letter-spacing:.06em;color:#0f3b4a;animation:up .9s .5s cubic-bezier(.2,.8,.2,1) both}
#intro .s{font:600 clamp(12px,2.2vw,16px) "DM Sans",sans-serif;letter-spacing:.42em;color:var(--mut);animation:up .9s .8s cubic-bezier(.2,.8,.2,1) both}
#intro .bar{width:170px;height:3px;margin-top:14px;background:#cfe0d5;border-radius:9px;overflow:hidden}#intro .bar i{display:block;height:100%;background:linear-gradient(90deg,#0f7a63,#1d5fa8,#6b3fa0);transform:translateX(-100%);animation:ld 2.1s .3s cubic-bezier(.4,0,.2,1) forwards}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-14deg)}}@keyframes dr{to{stroke-dashoffset:0}}@keyframes up{from{opacity:0;transform:translateY(14px)}}@keyframes ld{to{transform:none}}@keyframes pin{from{opacity:0;transform:translateY(18px)}}
@media(prefers-reduced-motion:reduce){#intro{display:none}#app,#app.lv,#app.en{transition:none;animation:none;transform:none;filter:none;opacity:1}}
</style>
